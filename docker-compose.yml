version: '3.8'

services:
  # Aplicación Next.js
  nextjs-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sharepoint-form-app
    restart: unless-stopped
    environment:
      - NODE_ENV=production
    networks:
      - app-network
    # No exponemos el puerto directamente, solo a través de nginx

  # Nginx como proxy reverso
  nginx:
    image: nginx:alpine
    container_name: sharepoint-form-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs/public.pem:/etc/nginx/ssl/public.pem:ro
      - ./certs/private.pem:/etc/nginx/ssl/private.pem:ro
    depends_on:
      - nextjs-app
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
